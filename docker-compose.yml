services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: calma
      POSTGRES_PASSWORD: calma
      POSTGRES_DB: calma
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calma -d calma"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
